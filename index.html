<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Часы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (max-width: 359px) {
            #clock {
                font-size: 2.8rem;
            }
        }
        @media (min-width: 360px) and (max-width: 639px) {
            #clock {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-900 dark:to-slate-800 flex flex-col min-h-screen">
    <div class="flex flex-1 items-center justify-center">
        <div class="text-center">
            <div id="clock" class="text-7xl font-bold font-mono text-slate-900 dark:text-white tracking-wide">
                00:00:00
            </div>
            <div class="mt-6 text-2xl text-slate-600 dark:text-slate-300">
                Текущее время
            </div>
            <div id="date" class="mt-8 text-2xl text-slate-700 dark:text-slate-200">
                25 июля 2026
            </div>
        </div>
    </div>

    <footer class="py-6 text-center text-slate-600 dark:text-slate-400 text-sm border-t border-slate-300 dark:border-slate-700">
        © <span id="year">2026</span> Все права защищены
    </footer>

    <script src="script.js"></script>
</body>
</html>
